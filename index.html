<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#080b11">
<meta name="description" content="Assista canais de TV ao vivo do mundo todo, de graça, direto do navegador.">
<title>IPTV Live — Canais Abertos</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================== HEADER ============================== -->
<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>IPTV<span>Live</span></h1>
  </div>

  <div class="search-wrap">
    <input id="searchInput" type="text" inputmode="search" data-i18n-placeholder="searchPlaceholder" placeholder="Buscar canal, país ou categoria..." autocomplete="off">
  </div>

  <select id="languageSelect" class="language-select" title="Idioma" aria-label="Idioma">
    <option value="pt-BR">PT</option><option value="en">EN</option><option value="es">ES</option>
  </select>
  <button id="viewToggleBtn" class="icon-btn view-toggle" data-i18n-title="gridView" title="Alternar para grade" aria-label="Alternar para grade">▦</button>
  <button id="notifyBtn" class="icon-btn" data-i18n-title="enableNotifications" title="Ativar notificações" aria-label="Ativar notificações">♢</button>
  <button id="epgBtn" class="icon-btn" data-i18n-title="openEpg" title="Abrir programação EPG" aria-label="Abrir programação EPG">▤</button>
  <button id="favToggleBtn" class="icon-btn" data-i18n-title="viewFavorites" title="Ver favoritos" aria-label="Ver favoritos">★</button>
</header>

<!-- ============================== FILTROS ============================== -->
<nav class="filters">
  <select id="countryFilter"><option value="" data-i18n="allCountries">Todos os países</option></select>
  <select id="categoryFilter"><option value="" data-i18n="allCategories">Todas as categorias</option></select>
  <div id="statusLine" class="status-line" data-i18n="loadingChannels">carregando canais...</div>
</nav>

<!-- ============================== GRID DE CANAIS ============================== -->
<main>
  <div id="channelRows" class="channel-rows" aria-live="polite"></div>
  <div id="emptyState" class="empty-state hidden">
    <p data-i18n="noChannels">Nenhum canal encontrado.</p>
    <span data-i18n="tryFilters">Tente limpar a busca ou trocar os filtros.</span>
  </div>
</main>

<aside id="epgPanel" class="epg-panel hidden" data-i18n-aria-label="epgSchedule" aria-label="Programação EPG">
  <div class="epg-head">
    <div><span class="eyebrow" data-i18n="scheduleLabel">GRADE HORÁRIA</span><h2 data-i18n="schedule">Programação</h2></div>
    <button id="epgCloseBtn" class="icon-btn" data-i18n-title="closeSchedule" title="Fechar programação" aria-label="Fechar programação">✕</button>
  </div>
  <p id="epgStatus" class="epg-status">Nenhuma fonte EPG configurada.</p>
  <div id="epgList" class="epg-list"></div>
  <button id="epgSourceBtn" class="text-btn" data-i18n="configureEpg">Configurar fonte EPG</button>
</aside>

<!-- ============================== PLAYER MODAL ============================== -->
<div id="playerModal" class="player-modal hidden">
  <div class="player-shell">
    <div class="player-head">
      <img id="playerLogo" class="player-logo" alt="">
      <div class="player-titles">
        <strong id="playerName">—</strong>
        <span id="playerMeta">—</span>
      </div>
      <button id="playerPipBtn" class="icon-btn player-action" title="Picture-in-Picture" aria-label="Ativar Picture-in-Picture">▣</button>
      <button id="playerCastBtn" class="icon-btn player-action" title="Transmitir para Chromecast" aria-label="Transmitir para Chromecast">◉</button>
      <button id="playerFavBtn" class="icon-btn" title="Favoritar">☆</button>
      <button id="playerCloseBtn" class="icon-btn" title="Fechar" aria-label="Fechar player">✕</button>
    </div>
    <div class="video-wrap">
      <video id="videoEl" playsinline controls autoplay></video>
      <div id="playerOverlay" class="player-overlay hidden">
        <p id="playerOverlayText">Conectando ao sinal...</p>
      </div>
    </div>
  </div>
</div>

<!-- HLS.js: necessário para tocar streams .m3u8 em navegadores sem suporte nativo a HLS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" defer></script>
<script src="config.js" defer></script>
<script src="locales.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
